<svg viewBox="0 0 380 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c88"/>
      <stop offset="100%" stop-color="#2ec4b6"/>
    </linearGradient>
    <style>
      /* Growth line animation faster */
      .growth-line {
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
      animation: drawLine 1.2s ease forwards;
      }
      @keyframes drawLine { to { stroke-dashoffset: 0; } }

      /* Tile pulse animation faster */
      .tile {
      transform-origin: center;
      animation: pulse 1s infinite alternate;
      }
      @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.12); opacity: 1; }
      }

      /* Text styling */
      .logo-text {
      font-family: 'Arial', sans-serif;
      font-weight: bold;
      font-size: 48px;
      fill: #fff;
      }
      .logo-subtext {
      font-family: 'Arial', sans-serif;
      font-weight: 300;
      font-size: 36px;
      fill: #fff;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="380" height="120" rx="18" fill="url(#grad)"/>

  <!-- Tiles -->
  <rect class="tile" x="25" y="25" width="30" height="30" rx="6" fill="#fff"/>
  <rect class="tile" x="65" y="25" width="30" height="50" rx="6" fill="#fff" style="animation-delay: 0.1s"/>
  <rect class="tile" x="25" y="65" width="30" height="30" rx="6" fill="#fff" style="animation-delay: 0.2s"/>

  <!-- Animated growth line -->
  <polyline class="growth-line" points="25,85 40,65 65,75 90,50"
            fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text stacked beside logo -->
  <text x="120" y="40" class="logo-text" dominant-baseline="middle">Business</text>
  <text x="120" y="85" class="logo-subtext" dominant-baseline="middle">Dashboard</text>
</svg>
