{% extends "layout.html" %} 

{% block content %}
    <div class="reset-password-section container">
        <!-- Reset Password Form -->
        {% if form_type == "reset" %}
            <h2>Set a New Password</h2>
            <form action="{{ url_for('auth.reset_password', token=token) }}" method="post">
                <div class="mb-3">
                    <label for="new_password">New Password:</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" autofocus required/>
                </div>
                <div class="mb-3">
                    <label for="confirm_password">Confirm New Password:</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required >
                </div>
                <div>
                    <button type="submit" class="btn btn-primary me-2">Set Password</button>
                </div>
            </form>

        <!-- Confirming new password submission -->
        {% elif form_type == "success" %}
            <h2>Your password has been successfully reset.</h2>
            <a href="{{ url_for('login') }}" class="btn btn-primary">Go to Login</a>
        {% endif %}
    </div>
{% endblock %}
