<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c88"/>
      <stop offset="100%" stop-color="#2ec4b6"/>
    </linearGradient>

    <style>
      /* Growth line animation */
      .growth-line {
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
      animation: drawLine 2s ease forwards;
      }

      @keyframes drawLine {
      to { stroke-dashoffset: 0; }
      }

      /* Tile pulse animation */
      .tile {
      transform-origin: center;
      animation: pulse 1.5s infinite alternate;
      }

      @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.1); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Animated gradient background -->
  <rect x="30" y="30" width="120" height="120" rx="18" fill="url(#grad)"/>

  <!-- Dashboard tiles with subtle animation -->
  <rect class="tile" x="55" y="55" width="30" height="30" rx="6" fill="#fff"/>
  <rect class="tile" x="95" y="55" width="30" height="50" rx="6" fill="#fff" style="animation-delay: 0.2s"/>
  <rect class="tile" x="55" y="95" width="30" height="30" rx="6" fill="#fff" style="animation-delay: 0.4s"/>

  <!-- Animated growth line -->
  <polyline class="growth-line" points="55,115 75,95 95,105 120,80"
            fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
