<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
    <defs>
        <style>
            /* Growth line animation faster */
            .growth-line {
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
            animation: drawLine 1.2s ease forwards; /* faster */
            }
            @keyframes drawLine {
            to { stroke-dashoffset: 0; }
            }

            /* Tile pulse faster */
            .tile {
            transform-origin: center;
            animation: pulse 1s infinite alternate; /* faster pulse */
            }
            @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.12); opacity: 1; }
            }
        </style>
    </defs>

    <!-- Tiles -->
    <rect class="tile" x="25" y="25" width="30" height="30" rx="6" fill="#fff"/>
    <rect class="tile" x="65" y="25" width="30" height="50" rx="6" fill="#fff" style="animation-delay: 0.1s"/>
    <rect class="tile" x="25" y="65" width="30" height="30" rx="6" fill="#fff" style="animation-delay: 0.2s"/>

    <!-- Animated growth line -->
    <polyline class="growth-line" points="25,85 40,65 65,75 90,50"
              fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
